name: Build dialog audio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Antrean: proses yang sedang berjalan TIDAK dibatalkan oleh upload baru.
# Upload berikutnya menunggu giliran. Kalau ada beberapa yang menunggu,
# yang terbaru dipakai (isinya sudah mencakup semua file sebelumnya).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache berisi suara yang sudah pernah dibuat, supaya tidak dibuat ulang.
      - name: Restore audio cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: tts-cache-${{ github.run_id }}
          restore-keys: |
            tts-cache-

      # Cek cepat: adakah dialog atau shadowing baru/berubah?
      - name: Check what needs to be generated
        id: plan
        run: |
          need_podcast=$(python generate.py --check)
          need_shadowing=$(python generate_shadowing.py --check)
          echo "podcast: $need_podcast, shadowing: $need_shadowing"
          if [ "$need_podcast" = "true" ] || [ "$need_shadowing" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      # ffmpeg dan edge-tts hanya dipasang kalau memang ada yang perlu dibuat.
      - name: Install ffmpeg and edge-tts
        if: steps.plan.outputs.needed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install edge-tts

      - name: Generate podcast audio
        run: python generate.py

      - name: Generate shadowing audio
        continue-on-error: true
        run: python generate_shadowing.py

      # Simpan cache hanya kalau ada yang baru dibuat (tetap disimpan walau ada error).
      - name: Save audio cache
        if: always() && steps.plan.outputs.needed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: tts-cache-${{ github.run_id }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
